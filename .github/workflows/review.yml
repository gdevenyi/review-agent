# Reusable workflow: leave a Draft Review (or, with `publish`, a Published
# Review as COMMENT) on one Target PR, as the Reviewer.
#
# Call it from your PRIVATE runner repo. That repo holds your config file and
# your secrets. Run logs of a public repo are public. See
# docs/examples/review-runner/.github/workflows/review.yml and the README.
#
# The workflow writes no Review content to the log, to the job summary or to
# artifacts. It uploads no artifacts.
name: review

on:
  workflow_call:
    inputs:
      pr_url:
        description: "Target PR URL: https://github.com/<owner>/<repo>/pull/<number>"
        required: true
        type: string
      publish:
        description: "Submit the Review at once as a COMMENT (default: Draft Review)"
        required: false
        type: boolean
        default: false
      ref:
        description: "The review-agent ref to install. Use the ref of `uses:`."
        required: false
        type: string
        default: master
      config:
        description: "Path of the config file in the runner repo"
        required: false
        type: string
        default: review-agent/config.toml
      issue_number:
        description: >-
          Optional. An issue number in the runner repo. After a successful
          run, the workflow posts a copy of the Review on that issue. Only
          when the runner repo is private. The caller job must allow
          `issues: write`.
        required: false
        type: string
        default: ""
      claude_version:
        description: "The Claude Code version to install"
        required: false
        type: string
        default: "2.1.304"
    secrets:
      reviewer_token:
        description: "The Reviewer's GitHub personal access token (not GITHUB_TOKEN)"
        required: true
      engine_key:
        description: "The engine key (for example the Z.AI API key)"
        required: true
      extra_tokens:
        description: >-
          Optional. More GitHub tokens for `[auth.tokens]` in the config: one
          NAME=value line per token. Each NAME becomes an environment variable
          of the review step.
        required: false

# No `permissions:` here: a reusable workflow can only keep or reduce the
# caller's permissions. The caller job sets them: `contents: read`, and
# `issues: write` when it passes `issue_number`.

jobs:
  review:
    runs-on: ubuntu-24.04
    # The engine has 45 minutes for one run, retry included; the rest is setup.
    timeout-minutes: 60
    steps:
      - name: Check out the runner repo (config and Reviewer Instructions)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install bubblewrap
        # On GitHub's ubuntu-24.04 runners AppArmor blocks unprivileged user
        # namespaces (kernel.apparmor_restrict_unprivileged_userns=1), so
        # bwrap fails with "setting up uid map: Permission denied". The VM is
        # used for this job only, so we allow them. Both commands are
        # best-effort: without them the tool runs the engine without a
        # sandbox and writes a warning (ADR 0002).
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0  # setup-uv has no major-version tags
        with:
          # The runner repo has no Python project to key a cache on.
          enable-cache: false

      - name: Install Claude Code ${{ inputs.claude_version }}
        env:
          CLAUDE_VERSION: ${{ inputs.claude_version }}
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install review-agent (${{ inputs.ref }})
        env:
          REF: ${{ inputs.ref }}
        run: |
          uv tool install "git+https://github.com/gdevenyi/review-agent@${REF}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          claude --version
          bwrap --version || echo "bwrap is not installed"
          command -v review

      - name: Review
        env:
          PR_URL: ${{ inputs.pr_url }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PUBLISH: ${{ inputs.publish }}
          REVIEW_AGENT_CONFIG: ${{ github.workspace }}/${{ inputs.config }}
          REVIEW_AGENT_GITHUB_TOKEN: ${{ secrets.reviewer_token }}
          REVIEW_AGENT_ENGINE_KEY: ${{ secrets.engine_key }}
          EXTRA_TOKENS: ${{ secrets.extra_tokens }}
          DISABLE_AUTOUPDATER: "1"
        run: |
          # Extra GitHub tokens for [auth.tokens]: one NAME=value per line.
          # Mask each value before anything else. Never print a value.
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"
            case "$line" in '' | '#'*) continue ;; esac
            name="${line%%=*}"
            value="${line#*=}"
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
            if [ "$name" = "$line" ] || ! [[ "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              echo "::error::extra_tokens: each line must be NAME=value."
              exit 1
            fi
            case "$name" in
              PATH | HOME | SHELL | IFS | ENV | BASH_ENV | LD_* | GITHUB_* | RUNNER_* | \
                ACTIONS_* | REVIEW_AGENT_* | ANTHROPIC_* | CLAUDE_*)
                echo "::error::extra_tokens: $name is a reserved name. Use another name."
                exit 1
                ;;
            esac
            export "$name=$value"
          done <<< "$EXTRA_TOKENS"
          unset EXTRA_TOKENS line name value

          args=("$PR_URL" --actions)
          if [ -n "$ISSUE_NUMBER" ]; then
            args+=(--review-copy "$RUNNER_TEMP/review-copy.md")
          fi
          if [ "$PUBLISH" = "true" ]; then
            args+=(--publish)
          fi
          review "${args[@]}"

      - name: Copy the Review to the issue
        if: always() && inputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          # The copy holds Review content: never print it.
          copy="$RUNNER_TEMP/review-copy.md"
          if [ ! -s "$copy" ]; then
            echo "No Review to copy."
            exit 0
          fi
          if [ "$REPO_PRIVATE" != "true" ]; then
            echo "::warning::The runner repo is not private, so the Review is not copied to the issue."
          else
            # An issue comment holds at most 65536 characters.
            python3 - "$copy" <<'PY'
          import sys
          p = sys.argv[1]
          t = open(p, encoding="utf-8").read()
          if len(t) > 65000:
              t = t[:65000] + "\n\n(Cut: the full Review is on the PR.)\n"
              open(p, "w", encoding="utf-8").write(t)
          PY
            gh issue comment "$ISSUE_NUMBER" --body-file "$copy" >/dev/null
            echo "Copied the Review to issue #$ISSUE_NUMBER."
          fi
          rm -f "$copy"
